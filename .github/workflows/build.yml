---
# What a release is: the interpreter, the runtime a bundled program is built
# on, and the standard library it opens at run time - together, for every
# machine they were built for.
#
# Every job builds on a runner of the architecture it ships. The interpreter
# is cgo around a C virtual machine, so GOARCH alone builds nothing that runs:
# an arm64 asset has to come off an arm64 runner, and one that does not is an
# x86_64 binary with the wrong name on it.
on:
  push:
    tags:
      - "v*"
  # A run that builds everything and keeps the packages as artifacts, without
  # releasing them: the way to find out that packaging broke before tagging.
  workflow_dispatch:

permissions:
  contents: write

name: Build and release

env:
  GO_VERSION: "1.23.x"

jobs:
  # The tests first. Nothing is released off a tree that does not pass them.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool texinfo
      - run: make test

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install the build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool texinfo

      # A tag names the release; a run started by hand has no tag, and gets a
      # version that says so rather than the name of a branch, which nothing
      # that reads a version would accept.
      - name: Work out the version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and stage
        run: |
          make VERSION=${{ steps.v.outputs.tag }}
          make install PREFIX=/usr DESTDIR="$PWD/dist/root" VERSION=${{ steps.v.outputs.tag }}

      # The tarball is the same tree, rooted at tau/, for anyone whose package
      # manager is none of the three below. It works unpacked anywhere: the
      # interpreter finds its library beside itself.
      - name: Tarball
        run: |
          mkdir -p dist/tar/tau
          cp -r dist/root/usr/bin dist/root/usr/lib dist/tar/tau/
          cp LICENSE README.md dist/tar/tau/
          tar -C dist/tar -czf "dist/tau-${{ steps.v.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" tau

      - name: Packages
        env:
          PKG_ARCH: ${{ matrix.arch }}
          PKG_VERSION: ${{ steps.v.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          for t in deb rpm archlinux; do
            "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p "$t" -t dist/
          done

      # A package that installs and then cannot import is the failure this
      # whole file exists to avoid, so it is installed and used here.
      - name: Install the package and use it
        run: |
          sudo dpkg -i dist/tau_*_${{ matrix.arch }}.deb
          cd /tmp
          printf 'os = import("os")\natomic = import("sync/atomic")\nprintln("ok", atomic.Int(41).Add(1))\n' > check.tau
          env -u TAUPATH tau check.tau | grep -q 'ok 42'
          env -u TAUPATH tau version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and later are Apple silicon; macos-13 is the last Intel one.
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: brew install gcc@14 automake libtool texinfo autoconf

      # A tag names the release; a run started by hand has no tag, and gets a
      # version that says so rather than the name of a branch, which nothing
      # that reads a version would accept.
      - name: Work out the version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and stage
        run: |
          make CC=gcc-14 VERSION=${{ steps.v.outputs.tag }}
          make install CC=gcc-14 PREFIX=/usr DESTDIR="$PWD/dist/root" VERSION=${{ steps.v.outputs.tag }}

      - name: Tarball
        run: |
          mkdir -p dist/tar/tau
          cp -r dist/root/usr/bin dist/root/usr/lib dist/tar/tau/
          cp LICENSE README.md dist/tar/tau/
          tar -C dist/tar -czf "dist/tau-${{ steps.v.outputs.tag }}-macos-${{ matrix.arch }}.tar.gz" tau

      - name: Use what was built
        run: |
          cd /tmp
          printf 'os = import("os")\natomic = import("sync/atomic")\nprintln("ok", atomic.Int(41).Add(1))\n' > check.tau
          env -u TAUPATH "$GITHUB_WORKSPACE/dist/tar/tau/bin/tau" check.tau | grep -q 'ok 42'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  # Built on Windows rather than cross compiled, because the shared objects the
  # standard library opens are built by the makefiles in it, and those only know
  # they are on Windows when they are.
  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-go
            autoconf
            automake
            libtool
            texinfo

      - name: Work out the version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and stage
        run: |
          export PATH="/mingw64/bin:$PATH"
          make CC=gcc VERSION=${{ steps.v.outputs.tag }}
          make install CC=gcc PREFIX=/ DESTDIR="$(pwd)/dist/win" VERSION=${{ steps.v.outputs.tag }}
          mv dist/win/bin/tau dist/win/bin/tau.exe || true
          cp LICENSE README.md dist/win/

      # Present on the runner image, but installing it is a line and depending
      # on an image never changing is not.
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Installer
        shell: pwsh
        run: |
          $version = "${{ steps.v.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DTauVersion=$version" `
            "/DStageDir=$(Get-Location)\dist\win" `
            "/O$(Get-Location)\dist" `
            packaging\tau.iss

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\win\* -DestinationPath "dist\tau-${{ steps.v.outputs.tag }}-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.exe
            dist/*.zip

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: What is being released
        run: find assets -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: Tau ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/**/*
